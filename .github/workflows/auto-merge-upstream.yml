name: Auto-merge upstream main

on:
  schedule:
    - cron: "0 3 * * 1" # weekly, Monday 03:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  merge-upstream:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: wasm_parsing_target
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Add or update upstream remote
        run: |
          if git remote get-url upstream >/dev/null 2>&1; then
            git remote set-url upstream https://github.com/smartmontools/smartmontools.git
          else
            git remote add upstream https://github.com/smartmontools/smartmontools.git
          fi
          git fetch upstream main

      - name: Check if merge needed
        id: check
        run: |
          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "needed=false" >> "$GITHUB_OUTPUT"
            echo "Upstream already merged; nothing to do."
          else
            echo "needed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Merge upstream main without upstream workflows
        if: steps.check.outputs.needed == 'true'
        run: |
          target_head=$(git rev-parse HEAD)

          set +e
          git merge --no-ff --no-commit upstream/main
          merge_status=$?
          set -e

          if ! git rev-parse --quiet --verify MERGE_HEAD >/dev/null; then
            echo "::error::Merge failed before a merge commit could be prepared (exit $merge_status)."
            exit 1
          fi

          if (( merge_status > 1 )); then
            echo "::error::Merge failed unexpectedly (exit $merge_status)."
            git merge --abort
            exit "$merge_status"
          fi

          # GitHub's workflow token cannot push commits that change workflow
          # files. Treat this directory as fork-owned and restore its exact
          # pre-merge contents, including deletion of upstream-only workflows.
          git rm -r -f --quiet --ignore-unmatch -- .github/workflows
          git checkout "$target_head" -- .github/workflows

          mapfile -t conflicts < <(git diff --name-only --diff-filter=U)
          if (( ${#conflicts[@]} > 0 )); then
            echo "::error::Upstream merge has conflicts outside .github/workflows:"
            printf '  %s\n' "${conflicts[@]}"
            git merge --abort
            exit 1
          fi

          if ! git diff --cached --quiet "$target_head" -- .github/workflows; then
            echo "::error::Prepared merge unexpectedly changes .github/workflows."
            git diff --cached --name-status "$target_head" -- .github/workflows
            git merge --abort
            exit 1
          fi

          git commit --no-edit

          if ! git diff --quiet HEAD^1 HEAD -- .github/workflows; then
            echo "::error::Merge commit changes .github/workflows; refusing to push."
            git diff --name-status HEAD^1 HEAD -- .github/workflows
            exit 1
          fi

      - name: Push merge commit
        if: steps.check.outputs.needed == 'true'
        run: |
          git push origin HEAD:wasm_parsing_target
